services:
    ytdl_material:
        user: root
        environment: 
            ytdl_use_local_db: 'true'
        # restart: always
        build:
            context: .
            dockerfile: Dockerfile.custom
        volumes:
            - ./appdata:/app/appdata
            - ./audio:/app/audio
            - ./video:/app/video
            - ./subscriptions:/app/subscriptions
            - ./users:/app/users
        ports:
            - "8998:17442"
